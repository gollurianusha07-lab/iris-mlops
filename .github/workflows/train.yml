name: Iris ML Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "iris.csv"
      - "iris.csv.dvc"
      - "train_pipeline.py"
      - "requirements.txt"
      - ".github/workflows/train.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify dataset
        run: test -f iris.csv

      - name: Train and evaluate model
        run: python train_pipeline.py

      - name: Save updated model artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f model.keras scaler.pkl encoder.pkl
          if ! git diff --cached --quiet; then
            git commit -m "Update trained model artifacts"
            git push origin HEAD:main
          else
            echo "Model artifacts have no changes to commit."
          fi
